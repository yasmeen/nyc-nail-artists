<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYC Nail Artists</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--ink:#2a2226;--mute:#7a6f74;--acc:#c2577a;--line:#eadfe3;--chip:#f3e6eb;--star:#e8a13d}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 16px 10px;max-width:1200px;margin:auto}
h1{margin:0;font:600 30px/1.15 Georgia,'Times New Roman',serif;letter-spacing:-.5px}
header p{margin:6px 0 0;color:var(--mute);max-width:640px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.controls .in{max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
#q{flex:1 1 200px}label.p{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}label.p input{width:76px}
label.c{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;cursor:pointer}
button{cursor:pointer}#count{color:var(--mute);font-size:14px;margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer;user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:start}.card h2{margin:0;font-size:17px}
.photos{container-type:inline-size;margin:0 -16px;border-block:1px solid var(--line);background:#fff}.photos iframe{display:block;width:100%;height:calc(190px + 66.7cqw);border:0}
.posts{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px}.posts iframe{flex:0 0 260px;width:260px;height:470px;scroll-snap-align:start}
.stars{color:var(--star);font-size:13px;letter-spacing:1px}
.meta{color:var(--mute);font-size:13px}.meta a{color:inherit}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#f6f1f3;color:#6b5b63}
.prices{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}.prices b{font-weight:600;color:var(--mute)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.links a{text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px;background:var(--acc);color:#fff}
.links a.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.note{font-size:13px}.avail{font-size:13px;background:#fdf6e3;border:1px solid #f0dfae;border-radius:8px;padding:6px 10px}
#msg{max-width:1200px;margin:20px auto;padding:0 16px;color:var(--mute)}
.availability{max-width:1200px;margin:14px auto 0;padding:0 16px}
.availability-controls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.availability-controls label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.availability-controls input[type=date]{min-width:150px}.availability-controls input[type=time]{width:120px}
#checkAvailability{background:var(--acc);color:white;border-color:var(--acc)}#checkAvailability:disabled{opacity:.6;cursor:wait}
#availabilityResults{display:grid;gap:8px;margin-top:10px}
.availability-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(160px,1fr) minmax(160px,1fr) 2fr;gap:8px;align-items:center}
.availability-name{font-weight:650}.availability-service,.availability-state{font-size:13px;color:var(--mute)}
.availability-state{color:var(--ink)}.availability-state a{color:var(--acc);text-decoration:none}.stale{font-size:12px;color:#9a5b17;margin-left:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px}.slot{font-size:13px;text-decoration:none;padding:4px 8px;border-radius:999px;background:#f3e6eb;color:var(--acc)}
.availability-empty{color:var(--mute);font-size:13px;padding:6px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{max-width:1200px;margin:8px auto 32px;padding:0 16px;color:var(--mute);font-size:13px}
@media(max-width:600px){.availability-row{grid-template-columns:1fr;gap:4px}.availability-controls{align-items:stretch}.availability-controls label{flex:1 1 140px}.availability-controls input,.availability-controls select{min-width:0;max-width:100%}}
@media(max-width:560px){h1{font-size:24px}main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>💅 NYC Nail Artists</h1><p>Yasmeen's living directory — filter by service, neighborhood, price, or rating. Data reads live from the research sheet; edit the sheet and refresh.</p></header>
<div class="controls"><div class="in">
<input id="q" type="search" placeholder="Search name, services, styles, notes…">
<select id="hood"><option value="">All neighborhoods</option></select>
<select id="type"><option value="">All types</option></select>
<select id="plat"><option value="">Any booking platform</option></select>
<label class="p">Max $<input id="max" type="number" min="0" step="5" placeholder="any"></label>
<label class="p">★≥<input id="minr" type="number" min="0" max="5" step="0.1" placeholder="any"></label>
<select id="sort"><option value="">Sort: sheet order</option><option value="asc">Price: low → high</option><option value="desc">Price: high → low</option><option value="rate">Rating: high → low</option><option value="name">Name A–Z</option></select>
<label class="c"><input id="hideout" type="checkbox"> Hide ruled-out</label>
<button id="reset">Reset</button><span id="count"></span>
<div class="chips" id="svcchips"></div>
</div></div>
<section class="availability" aria-label="Check appointment availability">
 <div class="availability-controls">
  <label>Date <input id="availabilityDate" type="date"></label>
  <label>From <input id="availabilityFrom" type="time"></label>
  <label>To <input id="availabilityTo" type="time"></label>
  <label>Service <select id="availabilityService"><option value="">Any service</option></select></label>
  <button id="checkAvailability" type="button">Check availability</button>
 </div>
 <div id="availabilityResults" aria-live="polite"></div>
</section>
<div id="msg">Loading…</div><main id="list"></main>
<footer>Tip: share a filtered view — filters sync to the URL (e.g. <code>?svc=russian&amp;hood=Chelsea</code>).</footer>
<script>
const SHEET_ID='1yorNY5SrbFzbGx295afxff2bSLH23DHwdH58eMOI1vw';
const CSV_URL=new URLSearchParams(location.search).get('csv')||`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const API_URL=new URLSearchParams(location.search).get('api')||'/api/availability';
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}
 if(f||row.length){row.push(f);r.push(row)}return r.filter(x=>x.some(v=>v.trim()))}
const KEYS={name:'name',ig:'instagram',igurl:'instagram url',type:'type',hood:'neighborhood',addr:'address',phone:'phone',book:'booking url',plat:'booking platform',svc:'services',base:'base gel',hard:'hard gel',art:'art price',styles:'styles',rating:'rating',grate:'google rating',maps:'maps url',status:'status',why:'ruled-out',checked:'last checked',avail:'availability',notes:'notes',photos:'photo posts',ids:'platform ids (json)',avservice:'availability service',avenabled:'availability enabled',verified:'ids last verified'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>{u=(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return /^https?:\/\//i.test(u)?u:''};
const num=s=>{const m=String(s||'').match(/\$?\s*(\d+(?:\.\d+)?)/);return m?+m[1]:null};
const ratingNum=s=>{const m=String(s||'').match(/(\d(?:\.\d+)?)/);return m?+m[1]:null};
const SVC_DEFS=[['Russian','russian'],['Japanese gel','japanese'],['Hard gel / BIAB','hard gel|builder|biab|structure'],['Gel-X','gel-?x'],['Acrylic','acrylic'],['Nail art','nail art|design|hand-paint']];
let data=[],activeSvcs=new Set(),checking=false;const $=id=>document.getElementById(id);
function toRows(rows){const h=rows[0].map(x=>x.trim().toLowerCase());const idx={};
 for(const[k,p]of Object.entries(KEYS)){idx[k]=h.findIndex(x=>x===p);if(idx[k]<0)idx[k]=h.findIndex(x=>x.startsWith(p))}
 return rows.slice(1).map((r,i)=>{const o={i};for(const k in idx)o[k]=idx[k]>=0?(r[idx[k]]||'').trim():'';
  const ps=[num(o.base),num(o.hard)].filter(x=>x!=null);o.price=ps.length?Math.min(...ps):null;
  o.rate=ratingNum(o.grate)||ratingNum(o.rating);
  o.hoods=o.hood?o.hood.split(/[\/,]/).map(s=>s.trim()).filter(Boolean):[];
  o.out=/ruled/i.test(o.status);
  const sv=(o.svc+' '+o.styles+' '+o.notes).toLowerCase();
  o.svcs=SVC_DEFS.filter(([,re])=>new RegExp(re).test(sv)).map(([label])=>label);
  o.blob=Object.values(o).join(' ').toLowerCase();return o}).filter(o=>o.name)}
function igHandle(o){const h=(o.ig||'').replace(/^@/,'').trim()||((o.igurl||'').match(/instagram\.com\/([^/?#]+)/i)||[])[1]||'';return /^[A-Za-z0-9._]{1,30}$/.test(h)?h:''}
function photosHTML(o){const posts=[...new Set([...(o.photos||'').matchAll(/instagram\.com\/(?:[^/\s]+\/)?(?:p|reel)\/([A-Za-z0-9_-]+)/gi)].map(m=>m[1]))];
 if(posts.length)return `<div class="photos posts">${posts.map(c=>`<iframe src="https://www.instagram.com/p/${c}/embed/" loading="lazy" scrolling="no" title="${esc(o.name)} Instagram post"></iframe>`).join('')}</div>`;
 const h=igHandle(o);return h?`<div class="photos"><iframe src="https://www.instagram.com/${h}/embed/" loading="lazy" scrolling="no" title="${esc(o.name)} Instagram"></iframe></div>`:''}
function fill(id,vals){const s=$(id);[...new Set(vals)].filter(Boolean).sort().forEach(v=>s.add(new Option(v,v)))}
function stars(r){if(r==null)return'';const f=Math.round(r);return `<span class="stars">${'★'.repeat(f)}${'☆'.repeat(5-f)}</span> <span class="meta">${esc(String(r).slice(0,3))}</span>`}
function syncURL(){const p=new URLSearchParams();
 const v={q:$('q').value,hood:$('hood').value,type:$('type').value,plat:$('plat').value,max:$('max').value,minr:$('minr').value,sort:$('sort').value};
 for(const[k,val]of Object.entries(v))if(val)p.set(k,val);
 if(activeSvcs.size)p.set('svc',[...activeSvcs].join(','));
 if($('hideout').checked)p.set('hideout','1');
 const current=new URLSearchParams(location.search);
 for(const key of ['csv','api'])if(current.get(key))p.set(key,current.get(key));
 history.replaceState(null,'',location.pathname+(p.toString()?'?'+p.toString():'')+location.hash)}
function filtered(){const q=$('q').value.toLowerCase().trim(),h=$('hood').value,t=$('type').value,pl=$('plat').value,
 mx=parseFloat($('max').value),mr=parseFloat($('minr').value),so=$('sort').value,hide=$('hideout').checked;
 let L=data.filter(o=>(!q||q.split(/\s+/).every(w=>o.blob.includes(w)))&&(!h||o.hoods.includes(h))&&(!t||o.type===t)&&(!pl||o.plat===pl)
  &&(isNaN(mx)||(o.price!=null&&o.price<=mx))&&(isNaN(mr)||(o.rate!=null&&o.rate>=mr))&&(!hide||!o.out)
  &&[...activeSvcs].every(s=>o.svcs.includes(s)));
 const P=o=>o.price??(so=='asc'?Infinity:-Infinity);
 if(so=='asc')L.sort((a,b)=>P(a)-P(b));else if(so=='desc')L.sort((a,b)=>P(b)-P(a));
 else if(so=='rate')L.sort((a,b)=>(b.rate??-1)-(a.rate??-1));else if(so=='name')L.sort((a,b)=>a.name.localeCompare(b.name));
 return L}
function render(){const L=filtered();
 $('count').textContent=`${L.length} of ${data.length}`;
 $('list').innerHTML=L.map(o=>{const ig=url(o.igurl)||(o.ig?'https://instagram.com/'+o.ig.replace(/^@/,''):''),bk=bookingLink(o);
  const maps=url(o.maps)||(o.addr?'https://maps.google.com/?q='+encodeURIComponent(o.name+' '+o.addr):'');
  const pr=[['Base gel',o.base],['Hard gel',o.hard],['Art',o.art]].filter(x=>x[1]).map(x=>`<b>${x[0]}</b><span>${esc(x[1])}</span>`).join('');
  return `<article class="card"><div class="top"><h2>${esc(o.name)}</h2></div>${photosHTML(o)}
  ${o.rate!=null?`<div>${stars(o.rate)}${o.grate?` <span class="meta">Google</span>`:''}</div>`:''}
  <div class="meta">${esc([o.type,o.hood].filter(Boolean).join(' · '))}</div>
  ${o.svcs.length?`<div class="tags">${o.svcs.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>`:''}
  ${o.addr?`<div class="meta">📍 ${maps?`<a href="${esc(maps)}" target="_blank" rel="noopener">${esc(o.addr)}</a>`:esc(o.addr)}</div>`:''}
  ${o.phone?`<div class="meta">📞 <a href="tel:${esc(o.phone.replace(/[^\d+]/g,''))}">${esc(o.phone)}</a></div>`:''}
  ${o.avail?`<div class="avail">📅 ${esc(o.avail)}</div>`:''}
  ${o.svc?`<div class="note"><b>Services:</b> ${esc(o.svc)}</div>`:''}${pr?`<div class="prices">${pr}</div>`:''}
  ${o.styles?`<div class="note"><b>Styles:</b> ${esc(o.styles)}</div>`:''}${o.notes?`<div class="note">${esc(o.notes)}</div>`:''}
  ${o.why?`<div class="note"><b>Note:</b> ${esc(o.why)}</div>`:''}${o.checked?`<div class="meta">Last checked ${esc(o.checked)}</div>`:''}
  <div class="links">${ig?`<a href="${esc(ig)}" target="_blank" rel="noopener">${esc(o.ig||'Instagram')}</a>`:''}${bk?`<a class="alt" href="${esc(bk)}" target="_blank" rel="noopener">Book${o.plat?' ('+esc(o.plat)+')':''}</a>`:''}</div></article>`}).join('');
 $('msg').textContent=L.length?'':'No matches.';syncURL()}
function availabilityRows(){const service=$('availabilityService').value;return filtered().filter(o=>!service||o.avservice===service)}
function tomorrowNY(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day+1));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
function bookingLink(o){const value=(o.book||'').trim();if(!value||/^(none\b|n\/a\b|dm\b|instagram\b|phone\b|call\b)/i.test(value)||(/\s/.test(value)&&!value.includes('.')))return'';return url(value)}
function instagramLink(o){return url(o.igurl)||(o.ig?'https://instagram.com/'+o.ig.replace(/^@/,''):'')}
function phoneLink(o){const number=(o.phone||'').replace(/[^\d+]/g,'');return /\d/.test(number)?`tel:${number}`:''}
function manualContact(o){const bk=bookingLink(o);if(bk)return{state:'Check manually',action:bk};const phone=phoneLink(o);if(phone)return{state:'Call',action:phone};return{state:'Check Instagram',action:instagramLink(o)}}
function staleIDs(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return true;const parsed=Date.parse(value);if(!Number.isFinite(parsed)||new Date(parsed).toISOString().slice(0,10)!==value)return true;return (Date.now()-parsed)>30*24*60*60*1000}
function availabilityState(error){return ({timeout:'Timed out',blocked:'Blocked — check manually',upstream:'Error — check manually',manual:'Check manually'})[error]||'Error — check manually'}
function paintAvailability(items){$('availabilityResults').innerHTML=items.map(({o,state,slots=[],warning='',action})=>{const bk=bookingLink(o),ig=instagramLink(o),href=bk||ig,service=(o.avservice||'').trim();
 const chips=slots.map(slot=>{const time=new Date(slot.start).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});const title=slot.staff?` title="${esc(slot.staff)}"`:'';return href?`<a class="slot" href="${esc(href)}" target="_blank" rel="noopener"${title}>${esc(time)}</a>`:`<span class="slot"${title}>${esc(time)}</span>`}).join('');
 const label=state==='Loading…'?`<span class="spinner"></span>${esc(state)}`:esc(state),target=action&&!action.startsWith('tel:')?' target="_blank" rel="noopener"':'';
 const stateHtml=action?`<a href="${esc(action)}"${target}>${label}</a>`:label;
 return `<article class="availability-row"><div><div class="availability-name">${esc(o.name)}${warning?`<span class="stale">${esc(warning)}</span>`:''}</div>${service?`<div class="availability-service">${esc(service)}</div>`:''}</div><div class="availability-state">${stateHtml}</div><div class="slots">${chips}</div></article>`}).join('')||'<div class="availability-empty">No places to check with these filters.</div>'}
async function checkAvailability(){if(checking)return;checking=true;const button=$('checkAvailability');button.disabled=true;button.textContent='Checking…';
 const places=availabilityRows(),selectedDate=$('availabilityDate').value;const from=$('availabilityFrom').value,to=$('availabilityTo').value;
 const items=places.map(o=>({o,state:'',slots:[],action:'',warning:/^y$/i.test(o.avenabled)&&staleIDs(o.verified)?'IDs may be stale':''}));paintAvailability(items.map(x=>({...x,state:'Loading…'})));
 await Promise.all(items.map(async item=>{const o=item.o,bk=bookingLink(o);if(!/^y$/i.test(o.avenabled)){Object.assign(item,manualContact(o));return}
 if(!o.ids){Object.assign(item,manualContact(o));return}
 let ids;try{ids=JSON.parse(o.ids)}catch{item.state='IDs invalid';return}
 if(!ids||typeof ids!=='object'||Array.isArray(ids)){item.state='IDs invalid';return}
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{const response=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},signal:controller.signal,body:JSON.stringify({platform:o.plat,ids,date:selectedDate,...(from?{from}:{}),...(to?{to}:{})})});if(!response.ok)throw new Error('request failed');const result=await response.json();if(result.error){item.state=availabilityState(result.error);if(item.state.includes('check manually'))item.action=bk;return}item.slots=Array.isArray(result.slots)?result.slots:[];item.state=item.slots.length?`${item.slots.length} openings`:'No openings that day'}catch(error){item.state=controller.signal.aborted?'Timed out':'Error — check manually';if(item.state.includes('check manually'))item.action=bk}finally{clearTimeout(timer)}}));
 paintAvailability(items);checking=false;button.disabled=false;button.textContent='Check availability'}
fetch(CSV_URL).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{
 if(/^\s*</.test(t))throw new Error('sheet is not public');data=toRows(parseCSV(t));
 fill('hood',data.flatMap(o=>o.hoods));fill('type',data.map(o=>o.type));fill('plat',data.map(o=>o.plat));fill('availabilityService',data.map(o=>o.avservice));
 const chips=$('svcchips');
 SVC_DEFS.forEach(([label])=>{const c=document.createElement('span');c.className='chip';c.textContent=label;
  c.onclick=()=>{activeSvcs.has(label)?activeSvcs.delete(label):activeSvcs.add(label);c.classList.toggle('on');render()};chips.appendChild(c)});
 const qp=new URLSearchParams(location.search);
 ['q','hood','type','plat','max','minr','sort'].forEach(id=>{if(qp.get(id))$(id).value=qp.get(id)});
 if(qp.get('hideout')==='1')$('hideout').checked=true;
 (qp.get('svc')||'').split(',').forEach(s=>{const lbl=SVC_DEFS.map(d=>d[0]).find(l=>l.toLowerCase()===s.toLowerCase());
  if(lbl){activeSvcs.add(lbl);[...chips.children].find(c=>c.textContent===lbl)?.classList.add('on')}});
 ['q','hood','type','plat','max','minr','sort','hideout','availabilityService'].forEach(id=>$(id).addEventListener('input',render));
 $('reset').onclick=()=>{['q','hood','type','plat','max','minr','sort','availabilityService'].forEach(id=>$(id).value='');$('hideout').checked=false;activeSvcs.clear();[...chips.children].forEach(c=>c.classList.remove('on'));render()};
 $('availabilityDate').value=tomorrowNY();$('checkAvailability').onclick=checkAvailability;render()
}).catch(e=>{$('msg').textContent='Could not load the sheet ('+e.message+'). Make sure it is shared as "Anyone with the link can view".'});
</script></body></html>
